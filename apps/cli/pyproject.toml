[project]
name = "seclab-cli"
version = "0.1.0"
description = "Unified `seclab` CLI: one entrypoint aggregating every module's own Typer sub-app, plus lab-wide commands (user management)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "seclab-core",
  "seclab-phantom",
  "seclab-recon",
  "seclab-monitor",
  "seclab-threatlens",
  "typer>=0.12.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[project.scripts]
seclab = "seclab_cli.main:app"

[tool.uv.sources]
seclab-core = { workspace = true }
seclab-phantom = { workspace = true }
seclab-recon = { workspace = true }
seclab-monitor = { workspace = true }
seclab-threatlens = { workspace = true }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
