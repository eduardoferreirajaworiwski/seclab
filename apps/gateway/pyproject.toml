[project]
name = "seclab-gateway"
version = "0.1.0"
description = "Unified FastAPI gateway for the seclab personal security laboratory - mounts every internal module (phantom, recon, monitor) under one API. The honeypot sensor (sensor_chimera) is deliberately NOT mounted here; it stays a separately deployable process."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "seclab-core",
  "seclab-phantom",
  "seclab-recon",
  "seclab-monitor",
  "seclab-threatlens",
  "seclab-cve-watch",
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "slowapi>=0.1.9,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[tool.uv.sources]
seclab-core = { workspace = true }
seclab-phantom = { workspace = true }
seclab-recon = { workspace = true }
seclab-monitor = { workspace = true }
seclab-threatlens = { workspace = true }
seclab-cve-watch = { workspace = true }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
