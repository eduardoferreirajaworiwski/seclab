[project]
name = "seclab-workspace"
version = "0.1.0"
description = "Personal security laboratory - unified monorepo workspace"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
  "packages/seclab-core",
  "packages/modules/phantom",
  "packages/modules/recon",
  "packages/modules/monitor",
  "packages/modules/sensor_chimera",
  "packages/modules/threatlens",
  "packages/modules/cve_watch",
  "apps/gateway",
  "apps/cli",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]
"**/tests/*.py" = ["S101"]

[tool.pytest.ini_options]
pythonpath = [
  "packages/seclab-core/src",
  "packages/modules/phantom/src",
  "packages/modules/recon/src",
  "packages/modules/monitor/src",
  "packages/modules/sensor_chimera/src",
  "packages/modules/threatlens/src",
  "packages/modules/cve_watch/src",
  "apps/gateway/src",
  "apps/cli/src",
]
testpaths = ["tests", "packages", "apps"]
addopts = "--import-mode=importlib"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
