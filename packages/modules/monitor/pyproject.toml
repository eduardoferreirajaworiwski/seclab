[project]
name = "seclab-monitor"
version = "0.1.0"
description = "Real-time Certificate Transparency stream monitor for seclab, absorbed from the abandoned hydra-mapper prototype: watches CertStream for brand-keyword matches, scores them through the phantom pipeline, and captures sandboxed forensic evidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "seclab-core",
  "seclab-phantom",
  "fastapi>=0.115.0,<1.0.0",
  "sqlalchemy>=2.0.30,<3.0.0",
  "certstream>=1.4.0,<2.0.0",
  "typer>=0.12.0,<1.0.0",
]

[project.optional-dependencies]
capture = [
  "playwright>=1.45.0,<2.0.0",
]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[tool.uv.sources]
seclab-core = { path = "../../seclab-core", editable = true }
seclab-phantom = { path = "../phantom", editable = true }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
