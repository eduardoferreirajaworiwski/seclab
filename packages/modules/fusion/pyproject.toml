[project]
name = "seclab-fusion"
version = "0.1.0"
description = "Cross-module correlation feed: thin read-only aggregator over monitor, threatlens, and cve_watch - no own persistence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "seclab-core",
  "seclab-monitor",
  "seclab-threatlens",
  "seclab-cve-watch",
  "fastapi>=0.115.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "sqlalchemy>=2.0.30,<3.0.0",
  "typer>=0.12.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[tool.uv.sources]
seclab-core = { workspace = true }
seclab-monitor = { workspace = true }
seclab-threatlens = { workspace = true }
seclab-cve-watch = { workspace = true }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
