[project]
name = "seclab-phantom"
version = "0.1.0"
description = "Lookalike/typosquat domain detection module for seclab, ported from phantomscope: CT-log discovery, DNS/RDAP/ASN enrichment, deterministic risk scoring, AI-assisted summary, Markdown/JSON reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "seclab-core",
  "fastapi>=0.115.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "sqlalchemy>=2.0.30,<3.0.0",
  "typer>=0.12.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[tool.uv.sources]
seclab-core = { workspace = true }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seclab_phantom = ["data/mock/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
